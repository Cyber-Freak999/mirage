[project]
name = "mirage"
version = "0.1.0"
description = "Honeypot-driven adaptive intrusion detection system"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask==3.0.3",
    "gunicorn==21.2.0",
    "scikit-learn==1.5.0",
    "xgboost==2.1.1",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "apscheduler==3.10.4",
    "sqlalchemy==2.0.30",
    "dash==2.17.0",
    "dash-bootstrap-components==1.6.0",
    "plotly==5.22.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.2.1",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]