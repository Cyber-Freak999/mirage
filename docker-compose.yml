services:
  honeypot-api:
    build:
      context: .
      dockerfile: Dockerfile.honeypot
    container_name: mirage-honeypot
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mirage-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # Override all three in production (dev defaults are insecure placeholders).
      - MIRAGE_SECRET_KEY=${MIRAGE_SECRET_KEY:-dev-only-insecure}
      - MIRAGE_API_KEY=${MIRAGE_API_KEY:-}
      - MIRAGE_ADMIN_KEY=${MIRAGE_ADMIN_KEY:-}
      - MIRAGE_RATE_LIMIT_PER_MIN=${MIRAGE_RATE_LIMIT_PER_MIN:-60}
    networks:
      - mirage-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: mirage-dashboard
    restart: unless-stopped
    ports:
      - "8050:8050"
    volumes:
      - mirage-data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MIRAGE_SECRET_KEY=${MIRAGE_SECRET_KEY:-dev-only-insecure}
      - MIRAGE_ADMIN_KEY=${MIRAGE_ADMIN_KEY:-}
      - DASH_DEBUG=${DASH_DEBUG:-false}
    networks:
      - mirage-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  retrainer:
    build:
      context: .
      dockerfile: Dockerfile.honeypot
    container_name: mirage-retrainer
    restart: unless-stopped
    command: python -m app.retrain.scheduler_entry
    volumes:
      - mirage-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - MIRAGE_SECRET_KEY=${MIRAGE_SECRET_KEY:-dev-only-insecure}
    # NOTE: 2G cap is why retraining sample caps exist (0.05/0.25 in
    # RetrainingConfig). Do not raise the caps without raising this limit.
    # Never start this service on the small dev host: a drift trigger could
    # launch a multi-GB retrain against the shared data volume.
    networks:
      - mirage-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run

volumes:
  mirage-data:
    driver: local

networks:
  # Single internal network by decision (BACKLOG #19): internal:true means no
  # internet route (honeypot isolation control), and services share a volume
  # rather than sockets, so splitting buys no containment.
  mirage-internal:
    driver: bridge
    internal: true
    enable_ipv6: false